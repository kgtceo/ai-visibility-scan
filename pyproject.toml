[project]
name = "ai-visibility-scan"
version = "0.1.0"
description = "AI Visibility Scan: what the answer engines say about a brand, measured per engine, with sources."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kareem Ghazal" }]
keywords = ["llm", "ai-visibility", "geo", "answer-engines", "evals"]
dependencies = [
    "anthropic>=0.60",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "playwright>=1.50",
]

[project.optional-dependencies]
engines = ["openai>=1.60", "google-genai>=1.0"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
aivs = "aivs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aivs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: the report template and prompts carry long lines on purpose. B008: typer's Option() defaults are its idiom.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
