# Brief: Monzo, UK personal current accounts.
# The client's facts are the only thing the scan trusts; everything else is what the engines say.
# Facts marked `to_confirm` are NOT used for accuracy scoring until confirmed on monzo.com.

client:
  name: Monzo
  aliases: ["Monzo Bank", "monzo.com", "Monzo's"]
  domains: ["monzo.com", "community.monzo.com"]

competitors:
  - name: Starling
    aliases: ["Starling Bank", "Starling's"]
    domains: ["starlingbank.com"]
  - name: Revolut
    aliases: ["Revolut's"]
    domains: ["revolut.com"]
  - name: Chase
    aliases: ["Chase UK", "Chase Bank UK", "JPMorgan Chase UK", "Chase's"]
    domains: ["chase.co.uk"]
  - name: Nationwide
    aliases: ["Nationwide Building Society", "Nationwide's"]
    domains: ["nationwide.co.uk"]

category: UK personal current accounts and app-based banking
market: GB
city: London

# The attributes a UK shopper decides on. Sentiment is scored per attribute, not per brand.
attributes:
  - fees
  - savings_rates
  - app_and_features
  - customer_service
  - safety_and_trust
  - spending_abroad

facts:
  - id: F1
    statement: "Monzo had 15.2 million customers at 31 March 2026 (FY2026 annual report)."
    source: "https://monzo.com/annual-report/2026"
    status: verified
  - id: F2
    statement: "Monzo's revenue for the year to 31 March 2026 was £1.7bn, up 39%, with a profit of £172.6m."
    source: "https://monzo.com/annual-report/2026"
    status: verified
  - id: F3
    statement: "Monzo had 10.4 million monthly active customers in FY2026."
    source: "https://monzo.com/annual-report/2026"
    status: verified
  - id: F4
    statement: "Monzo reports a Net Promoter Score of 76 for FY2026."
    source: "https://monzo.com/annual-report/2026"
    status: verified
  - id: F5
    statement: "Monzo is a UK bank authorised by the PRA and regulated by the FCA and PRA; eligible deposits are protected by the FSCS up to £120,000 per person."
    source: "https://monzo.com/help/legal-stuff/deposit-protection-fscs"
    status: verified
  - id: F6
    statement: "Monzo charges no fee on card spending abroad in any currency; it passes on the Mastercard exchange rate with no extra charges."
    source: "https://monzo.com/help/travelling/understanding-fees"
    status: verified
  - id: F7
    statement: "On Monzo's free plan, fee-free cash withdrawals are £400 every 30 days in the UK and EEA (unlimited if Monzo is your main bank) and £200 every 30 days outside the EEA, with a 3% fee after the allowance."
    source: "https://monzo.com/help/travelling/understanding-fees"
    status: verified
  - id: F8
    statement: "Monzo's current paid plans are Extra at £3 a month, Perks at £9 a month and Max from £19 a month."
    source: "https://monzo.com/current-account/extra"
    status: verified
  - id: F9
    statement: "Monzo's Instant Access Savings rate on the free plan is 2.80% AER (variable), as checked on 21 November 2026."
    source: "https://monzo.com/savings-isas/instant-access"
    status: verified

# Brands we do not score but want to see coming. Counted by name in unbranded answers only
# (rules, no judge). If one keeps appearing, promote it to competitors for the next run.
watchlist:
  - {name: first direct, aliases: ["First Direct"]}
  - {name: Santander, aliases: ["Santander UK"]}
  - {name: NatWest, aliases: ["National Westminster"]}
  - {name: Lloyds, aliases: ["Lloyds Bank"]}
  - {name: HSBC, aliases: ["HSBC UK"]}
  - {name: Barclays, aliases: []}
  - {name: Kroo, aliases: ["Kroo Bank"]}
  - {name: Virgin Money, aliases: []}
  - {name: TSB, aliases: []}
  - {name: Zopa, aliases: ["Zopa Bank"]}
  - {name: Halifax, aliases: []}
  - {name: Tide, aliases: []}

