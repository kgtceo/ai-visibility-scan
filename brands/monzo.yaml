# 24 questions a UK shopper types. Unbranded ones measure whether Monzo makes the shortlist;
# branded ones measure what is said about Monzo once asked. Stages follow the journey.
questions:
  # discover (unbranded)
  - {id: D1, stage: discover, branded: false, text: "What's the best bank account in the UK for everyday spending?", attributes: [fees, app_and_features]}
  - {id: D2, stage: discover, branded: false, text: "Which app-based bank should I switch to in the UK?", attributes: [app_and_features, customer_service]}
  - {id: D3, stage: discover, branded: false, text: "Best UK bank for budgeting and saving pots?", attributes: [app_and_features, savings_rates]}
  - {id: D4, stage: discover, branded: false, text: "Which UK bank card is best for spending abroad with no fees?", attributes: [spending_abroad, fees]}
  - {id: D5, stage: discover, branded: false, text: "Best first bank account for a 16 year old in the UK?", attributes: [app_and_features, safety_and_trust]}
  - {id: D6, stage: discover, branded: false, text: "Which UK current account pays the best interest on savings right now?", attributes: [savings_rates]}
  - {id: D7, stage: discover, branded: false, text: "Best bank account for a sole trader or small business in the UK?", attributes: [fees, app_and_features]}
  - {id: D8, stage: discover, branded: false, text: "Which UK bank has the best customer service?", attributes: [customer_service]}
  # compare (unbranded: two or more brands named, Monzo may or may not be one)
  - {id: C1, stage: compare, branded: true, text: "Starling vs Revolut vs Chase, which is best as a main UK account?", attributes: [fees, savings_rates, app_and_features]}
  - {id: C2, stage: compare, branded: true, text: "Monzo vs Starling, which is better?", attributes: [fees, app_and_features, customer_service]}
  - {id: C3, stage: compare, branded: true, text: "Monzo or Revolut for travelling in Europe?", attributes: [spending_abroad, fees]}
  - {id: C4, stage: compare, branded: true, text: "Is Chase UK better than Monzo for cashback and savings?", attributes: [savings_rates, fees]}
  - {id: C5, stage: compare, branded: true, text: "Monzo vs Nationwide as my main current account?", attributes: [customer_service, safety_and_trust, app_and_features]}
  # choose (branded)
  - {id: H1, stage: choose, branded: true, text: "Are Monzo's paid plans worth it?", attributes: [fees, app_and_features]}
  - {id: H2, stage: choose, branded: true, text: "Does Monzo charge fees for spending or withdrawing cash abroad?", attributes: [spending_abroad, fees]}
  - {id: H3, stage: choose, branded: true, text: "What interest does Monzo pay on savings?", attributes: [savings_rates]}
  - {id: H4, stage: choose, branded: true, text: "Does Monzo offer an overdraft and what does it cost?", attributes: [fees]}
  - {id: H5, stage: choose, branded: true, text: "Can I open a joint account with Monzo and how does it work?", attributes: [app_and_features]}
  # trust (branded)
  - {id: T1, stage: trust, branded: true, text: "Is Monzo safe? Is my money protected if it goes bust?", attributes: [safety_and_trust]}
  - {id: T2, stage: trust, branded: true, text: "Is Monzo a real bank or just an app?", attributes: [safety_and_trust]}
  - {id: T3, stage: trust, branded: true, text: "Why do people complain about Monzo?", attributes: [customer_service, safety_and_trust]}
  - {id: T4, stage: trust, branded: true, text: "Does Monzo freeze accounts, and how do I get help if it happens?", attributes: [customer_service, safety_and_trust]}
  # switch (branded)
  - {id: S1, stage: switch, branded: true, text: "How do I switch my current account to Monzo and keep my direct debits?", attributes: [app_and_features]}
  - {id: S2, stage: switch, branded: true, text: "Can I use Monzo as my main account for salary and bills?", attributes: [app_and_features, safety_and_trust]}
